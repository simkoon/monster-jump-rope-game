<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>점프 아일랜드: 황금줄을 찾아라!</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">

  <!-- ================= 설정 화면 ================= -->
  <section id="setup" class="setup">
    <header class="setup-hero">
      <div class="setup-badges">
        <span>🏝 이동형 보드게임</span>
        <span>🪢 줄넘기 미션</span>
        <span>🤝 협동 + 반전</span>
      </div>
      <h1>점프 아일랜드<br/><b>황금줄을 찾아라!</b></h1>
      <p class="setup-sub">출발섬에서 황금줄 신전까지! 주사위를 굴리고 줄넘기 미션을 성공해 전진하세요.</p>
    </header>

    <div class="setup-card">
      <h2>1. 방식 선택</h2>
      <div class="chooser" id="modeChooser">
        <button class="choice active" data-mode="solo"><b>개인전</b><em>각자 말 1개 · 2~6명</em></button>
        <button class="choice" data-mode="team"><b>팀전</b><em>팀 말 1개 · 2~4팀</em></button>
      </div>

      <h2>2. <span id="countLabel">참가자</span> 수</h2>
      <div class="counter">
        <button id="countMinus" class="round-btn">−</button>
        <strong id="countValue">3</strong>
        <button id="countPlus" class="round-btn">+</button>
      </div>

      <h2>3. 연령대 (난이도)</h2>
      <div class="chooser" id="ageChooser">
        <button class="choice" data-age="8"><b>8~10세</b><em>기본 위주</em></button>
        <button class="choice active" data-age="11"><b>11~12세</b><em>표준</em></button>
        <button class="choice" data-age="13"><b>13~14세</b><em>도전 강화</em></button>
      </div>

      <h2>4. <span id="nameLabel">참가자</span> 이름</h2>
      <div id="nameInputs" class="name-inputs"></div>

      <button id="startBtn" class="start-btn">🚀 모험 시작!</button>
      <p class="setup-foot">기존 <a href="./monster.html">몬스터 제압 말판</a> · <a href="./design-plan.html" target="_blank" rel="noopener">기획안 원본 보기</a></p>
    </div>
  </section>

  <!-- ================= 게임 화면 ================= -->
  <section id="game" class="game" hidden>
    <header class="game-hero">
      <div class="hero-left">
        <span class="hero-badge">점프 아일랜드</span>
        <h1>황금줄을 찾아라!</h1>
      </div>
      <div class="hero-right">
        <div class="wave-flag" id="waveFlag" hidden>🌊 마지막 파도! 성공 보상 +1</div>
        <button id="rulesBtn" class="ghost-btn">📖 규칙</button>
        <button id="restartBtn" class="ghost-btn">↺ 새 게임</button>
      </div>
    </header>

    <div class="game-body">
      <!-- 말판 -->
      <div class="board-col">
        <div class="turn-banner">
          <span class="turn-label">지금 차례</span>
          <strong id="turnName">—</strong>
          <span class="turn-avatar" id="turnAvatar">🐰</span>
        </div>

        <div class="board" id="board" aria-label="점프 아일랜드 말판"></div>

        <div class="legend" id="legend"></div>
      </div>

      <!-- 조작 패널 -->
      <aside class="side-col">
        <div class="dice-panel">
          <div class="dice" id="dice">🎲</div>
          <button id="rollBtn" class="roll-btn">주사위 굴리기</button>
          <button id="reversalBtn" class="reversal-btn" hidden>🔁 역전 토큰 사용 (두 번 굴려 선택)</button>
          <p class="dice-hint" id="diceHint">주사위를 굴려 이동하세요. (5·6은 최대 4칸)</p>
        </div>

        <div class="players" id="players"></div>

        <details class="referee">
          <summary>🛠 진행자 도구</summary>
          <div class="ref-body" id="refBody"></div>
          <div class="ref-actions">
            <button id="waveBtn" class="ref-btn">🌊 마지막 파도 발동</button>
            <button id="finishBtn" class="ref-btn">🏁 지금 순위로 종료</button>
          </div>
        </details>

        <div class="log-wrap">
          <h3>진행 기록</h3>
          <ul id="log" class="log"></ul>
        </div>
      </aside>
    </div>
  </section>

  <!-- ================= 모달 / 토스트 ================= -->
  <div class="modal-back" id="modalBack" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="./script.js"></script>
</body>
</html>
